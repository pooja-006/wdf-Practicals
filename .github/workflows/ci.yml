# ============================================================
# .github/workflows/ci.yml  –  Practical 12: CI/CD Pipeline
# ============================================================
# Trigger  : every push to the 'main' branch
# Runner   : ubuntu-latest (GitHub-hosted)
# Jobs     : build-and-test
#
# Architecture:
#   git push → GitHub Actions trigger → checkout → Node setup
#               → npm install → npm test → pass ✅ or fail ❌
# ============================================================

name: CI Pipeline

on:
  push:
    branches: [main]      # Run on every push to main
  pull_request:
    branches: [main]      # Also run on PRs targeting main (Supplementary)

jobs:
  build-and-test:
    name: Build and Test (Node 18)
    runs-on: ubuntu-latest   # GitHub-hosted Linux runner

    # Set working directory for all run steps
    defaults:
      run:
        working-directory: backend

    steps:
      # ── Step 1: Check out the repository ─────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Step 2: Set up Node.js 18 ────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'              # Cache node_modules for faster runs
          cache-dependency-path: backend/package-lock.json

      # ── Step 3: Install dependencies ─────────────────────────
      - name: Install dependencies
        run: npm install

      # ── Step 4: Run tests ─────────────────────────────────────
      # Jest exit code 0 = all tests pass (green ✅)
      # Jest exit code 1 = at least one test failed (red ❌)
      # GitHub Actions marks the job as failed when any step
      # exits with a non-zero code.
      - name: Run tests
        run: npm test
        env:
          # Provide a dummy JWT_SECRET so the app module loads without warnings.
          # No real MongoDB is used — the model is mocked inside the test file.
          JWT_SECRET: ci_test_secret_not_used_in_production
          NODE_ENV: test
