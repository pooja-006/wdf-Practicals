# ============================================================
# docker-compose.yml  –  Practical 11: Containerization
# ============================================================
# Orchestrates 3 services:
#   • mongodb   – official MongoDB image (data store)
#   • backend   – Node/Express API (depends on mongodb)
#   • frontend  – React app served as static files (depends on backend)
#
# All services share the custom bridge network "app-network" so they
# can reach each other by SERVICE NAME instead of localhost/IP.
#
# Run the entire stack:  docker-compose up --build
# Stop and remove:       docker-compose down
# ============================================================

services:

  # ── Service 1: MongoDB ───────────────────────────────────────
  mongodb:
    image: mongo:7          # Official MongoDB image (no Dockerfile needed)
    container_name: taskdb-mongo
    restart: unless-stopped

    ports:
      - "27017:27017"       # host:container  (useful for Compass/debugging)

    volumes:
      # Named volume → data persists across "docker-compose down" restarts
      # (Supplementary requirement)
      - mongo-data:/data/db

    networks:
      - app-network

  # ── Service 2: Backend ───────────────────────────────────────
  backend:
    build:
      context: ./backend    # Docker uses backend/Dockerfile
    container_name: taskdb-backend
    restart: unless-stopped

    ports:
      - "5000:5000"         # host:container

    environment:
      # KEY POINT: use the Compose service name "mongodb" — NOT localhost.
      # Containers communicate via Docker's internal DNS on app-network.
      - MONGO_URI=mongodb://mongodb:27017/taskdb
      - JWT_SECRET=practical11_docker_jwt_secret_change_in_production
      - PORT=5000

    depends_on:
      - mongodb             # Compose starts mongodb BEFORE backend

    networks:
      - app-network

  # ── Service 3: Frontend ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend   # Docker uses frontend/Dockerfile (multi-stage)
    container_name: taskdb-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"         # host:container

    environment:
      # The frontend browser talks to the backend via the HOST machine's
      # port 5000 (not the Docker internal network), because the browser
      # runs on the host, not inside a container.
      - VITE_API_URL=http://localhost:5000

    depends_on:
      - backend             # Compose starts backend BEFORE frontend

    networks:
      - app-network

# ── Named Volumes ────────────────────────────────────────────
volumes:
  mongo-data:               # Persists MongoDB data across container restarts

# ── Networks ─────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge          # Default Docker bridge network
